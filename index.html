<!doctype html>
<html lang="en" data-theme="system" data-palette="sand">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F0E8" />
    <title>feasible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved mode and palette before the first paint, so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem("feasible-state-v1") || "null");
        if (saved && (saved.theme === "light" || saved.theme === "dark" || saved.theme === "system")) {
          document.documentElement.dataset.theme = saved.theme;
        }
        if (saved && /^(sand|cobalt|coral|lime|lavender|sage|copper|mono|hydra|aureus)$/.test(saved.palette || "")) {
          document.documentElement.dataset.palette = saved.palette;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
